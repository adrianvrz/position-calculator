<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Risk Master - Futures</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2535/2535032.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos de botones mejorados */
        .selector-btn {
            @apply bg-slate-700 border-2 border-transparent text-slate-400 font-bold py-3 rounded-xl transition-all duration-200;
        }
        .selector-btn:hover {
            @apply bg-slate-600 text-white;
        }
        /* Botón Activo: Resalte total */
        .btn-active {
            @apply bg-blue-600 border-blue-400 text-white shadow-[0_0_15px_rgba(59,130,246,0.5)] scale-[1.02] !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-xl border border-slate-700">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-black italic text-blue-400 tracking-tighter">FUTURES RISK MASTER</h1>
            <span class="bg-blue-900/50 text-blue-300 text-[10px] px-2 py-1 rounded border border-blue-700">BINANCE FAPI REAL-TIME</span>
        </div>
        
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="flex flex-col gap-2">
                <label class="text-xs font-bold text-slate-500 uppercase ml-1">Activo Perpetuo</label>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btnBTC" onclick="selectAsset('BTC')" class="selector-btn btn-active">BTC</button>
                    <button id="btnETH" onclick="selectAsset('ETH')" class="selector-btn">ETH</button>
                </div>
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-xs font-bold text-slate-500 uppercase ml-1">Acción</label>
                <button onclick="fetchFuturesPrices()" class="bg-slate-700 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2">
                    <span id="priceLoader" class="hidden animate-spin">⌛</span> Actualizar
                </button>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="col-span-2 md:col-span-1">
                <label class="text-xs font-bold text-slate-500 uppercase ml-1">Capital (USDT)</label>
                <input type="number" id="capital" value="1000" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-3 mt-1 outline-none focus:border-blue-500 text-blue-100 font-mono">
            </div>
            <div class="col-span-2 md:col-span-1">
                <label class="text-xs font-bold text-slate-500 uppercase ml-1">% Riesgo Cuenta</label>
                <input type="number" id="riskPerc" value="1" step="0.1" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-3 mt-1 outline-none focus:border-blue-500 text-blue-100 font-mono">
            </div>
            
            <div class="col-span-2">
                <label class="text-xs font-bold text-slate-500 uppercase ml-1">Dirección del Trade</label>
                <div class="grid grid-cols-2 gap-2 mt-1">
                    <button id="btnLong" onclick="selectSide('long')" class="selector-btn">LONG (Compra)</button>
                    <button id="btnShort" onclick="selectSide('short')" class="selector-btn btn-active">SHORT (Venta)</button>
                </div>
            </div>

            <div class="col-span-2">
                <label class="text-xs font-bold text-slate-500 uppercase ml-1">Precio de Entrada (Perpetual)</label>
                <input type="number" id="entryPrice" class="w-full bg-slate-900 border-2 border-blue-900/50 rounded-xl p-4 mt-1 outline-none text-2xl text-blue-400 font-black" placeholder="0.00">
            </div>
        </div>

        <div class="mb-8">
            <label class="text-xs font-bold text-slate-500 uppercase ml-1">Estrategia & Apalancamiento</label>
            <div class="grid grid-cols-3 gap-2 mt-1">
                <button id="btn5x" onclick="selectLeverage(5)" class="selector-btn">
                    <span class="block text-lg">5x</span>
                    <span class="text-[9px] opacity-60">Swing</span>
                </button>
                <button id="btn25x" onclick="selectLeverage(25)" class="selector-btn">
                    <span class="block text-lg">25x</span>
                    <span class="text-[9px] opacity-60">Intra</span>
                </button>
                <button id="btn50x" onclick="selectLeverage(50)" class="selector-btn btn-active">
                    <span class="block text-lg">50x</span>
                    <span class="text-[9px] opacity-60">Scalp</span>
                </button>
            </div>
        </div>

        <button onclick="calculate()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-lg py-5 rounded-2xl shadow-xl transform active:scale-95 transition-all">
            CALCULAR POSICIÓN
        </button>

        <div id="results" class="hidden mt-8 space-y-4 animate-in fade-in duration-500">
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700">
                    <span class="text-[10px] text-slate-500 uppercase font-bold block">Tamaño Posición</span>
                    <span id="resPosSize" class="text-xl font-bold text-blue-300">--</span>
                </div>
                <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700">
                    <span class="text-[10px] text-slate-500 uppercase font-bold block">Contratos (Lote)</span>
                    <span id="resLot" class="text-xl font-bold text-white">--</span>
                </div>
            </div>

            <div class="bg-red-900/20 p-5 rounded-2xl border-2 border-red-500/30">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-bold text-red-400 uppercase">🚨 Stop Loss Máximo (Liq)</span>
                    <span id="resStop" class="text-2xl font-black text-red-500">--</span>
                </div>
                <p class="text-[10px] text-red-300/70 leading-tight">
                    Este es tu límite de supervivencia. Perderás <span id="resRiskOut" class="font-bold">--</span> de tu capital total si el precio toca este nivel.
                </p>
            </div>
        </div>
    </div>

    <script>
        const symbols = {
            'BTC': { 'base': 'BTCUSDT', 'price': 0 },
            'ETH': { 'base': 'ETHUSDT', 'price': 0 }
        };
        
        let currentAsset = 'BTC';
        let currentSide = 'short';
        let currentLeverage = 50;

        // --- Manejo de UI Activa ---
        function updateUI(groupId, activeId) {
            const container = document.getElementById(activeId).parentElement;
            const buttons = container.querySelectorAll('button');
            buttons.forEach(btn => btn.classList.remove('btn-active'));
            document.getElementById(activeId).classList.add('btn-active');
        }

        function selectAsset(asset) {
            currentAsset = asset;
            updateUI('assetGroup', `btn${asset}`);
            updateEntryPriceInput();
        }

        function selectSide(side) {
            currentSide = side;
            updateUI('sideGroup', side === 'short' ? 'btnShort' : 'btnLong');
        }

        function selectLeverage(lev) {
            currentLeverage = lev;
            updateUI('levGroup', `btn${lev}x`);
        }

        function updateEntryPriceInput() {
            const price = symbols[currentAsset].price;
            document.getElementById('entryPrice').value = price ? price.toFixed(2) : '';
        }

        // --- Obtener Precios de FUTUROS (fapi) ---
        async function fetchFuturesPrices() {
            const loader = document.getElementById('priceLoader');
            loader.classList.remove('hidden');
            
            try {
                // Usamos la API de Binance Futures (fapi)
                const response = await fetch('https://fapi.binance.com/fapi/v1/ticker/price');
                const data = await response.json();
                
                // Buscamos BTC y ETH dentro de la lista de perpetuos
                data.forEach(item => {
                    if (item.symbol === 'BTCUSDT') symbols.BTC.price = parseFloat(item.price);
                    if (item.symbol === 'ETHUSDT') symbols.ETH.price = parseFloat(item.price);
                });

                updateEntryPriceInput();
            } catch (error) {
                console.error("Error API:", error);
                alert("Error al conectar con Binance Futures.");
            } finally {
                loader.classList.add('hidden');
            }
        }

        function calculate() {
            const capital = parseFloat(document.getElementById('capital').value);
            const riskPerc = parseFloat(document.getElementById('riskPerc').value);
            const entry = parseFloat(document.getElementById('entryPrice').value);
            
            if (!entry || entry <= 0) return alert("Ingresa un precio válido");

            const riskUSD = capital * (riskPerc / 100);
            const maxDistPerc = (100 / currentLeverage) / 100;

            let maxStopPrice;
            if (currentSide === 'short') {
                maxStopPrice = entry * (1 + maxDistPerc);
            } else {
                maxStopPrice = entry * (1 - maxDistPerc);
            }

            const posSizeUSD = riskUSD * currentLeverage;
            const lotAsset = posSizeUSD / entry;

            // Mostrar resultados
            document.getElementById('results').classList.remove('hidden');
            document.getElementById('resPosSize').innerText = `$${posSizeUSD.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('resLot').innerText = `${lotAsset.toFixed(4)} ${currentAsset}`;
            document.getElementById('resStop').innerText = `$${maxStopPrice.toFixed(2)}`;
            document.getElementById('resRiskOut').innerText = `${riskPerc}% ($${riskUSD.toFixed(2)})`;
        }

        // Carga inicial
        fetchFuturesPrices();
    </script>
</body>
</html>
